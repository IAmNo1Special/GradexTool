name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.12"
      install-command: "uv sync --all-extras --dev"
      lint-commands: |
        uv run ruff check .
        uv run ruff format --check .
        uv run --dev mypy .
        uv run --python 3.13 --dev mdformat --check --exclude '.venv/**' --exclude '.venv2/**' --exclude '.kilo/**' --exclude 'node_modules/**' --exclude '__pycache__/**' --exclude '.pytest_cache/**' .
      test-commands: "uv run pytest --cov=. --cov-report=xml"
      coverage-artifact-name: "coverage-xml"
      coverage-artifact-path: "coverage.xml"

  codecov:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
